[package]
name = "skyglow-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sun geometry, twilight timeline and cloud-shadow physics for predicting sunset sky colour."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "skyglow"
path = "src/main.rs"
