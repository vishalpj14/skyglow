[package]
name = "skyglow-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bridge: lets the web app call skyglow-core. JSON in, JSON out."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skyglow-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
